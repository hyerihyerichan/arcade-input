<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<title>오락실 정산 입력기</title>
<style>
:root{
  --bg:#f5f5f7;--card:#fff;--text:#111;--sub:#6b6b70;--line:#d8d8dc;
  --accent:#111;--soft:#ececef;--danger:#b42318;--ok:#087a3e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:auto;padding:18px 14px 50px}
h1{font-size:23px;margin:3px 0}.sub{font-size:13px;color:var(--sub);margin:5px 0 16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:0 0 14px;
box-shadow:0 1px 6px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.machine-btn{padding:18px 10px;border:0;border-radius:15px;background:var(--soft);
font-size:17px;font-weight:800}.machine-btn.active{background:#111;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.name{font-size:26px;font-weight:900}.progress{font-size:14px;color:var(--sub)}
label{display:block;font-size:15px;font-weight:800;margin:15px 0 7px}
input{width:100%;font-size:28px;font-weight:800;padding:13px 14px;border:2px solid var(--line);
border-radius:14px;background:#fff;outline:none}
input:focus{border-color:#222}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side-title{text-align:center;font-size:14px;font-weight:900;margin-top:14px}
.controls{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}
button{border:0;border-radius:14px;padding:14px 11px;background:var(--soft);font-size:16px;font-weight:850}
button.primary{background:#111;color:white}
button.danger{background:#fff0f0;color:var(--danger)}
button.ok{background:#eaf8ef;color:var(--ok)}
.status{min-height:20px;font-size:13px;color:var(--sub);margin-top:9px}
.result-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.result-buttons button{font-size:14px}
textarea{width:100%;height:190px;border:1px solid var(--line);border-radius:12px;
padding:12px;font-size:15px;background:#fafafa;resize:vertical}
.hidden{display:none}
.small{font-size:12px;color:var(--sub);margin-top:8px}
.calc{white-space:pre-wrap;word-break:break-word;background:#111;color:#fff;border-radius:16px;
padding:17px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;line-height:1.55}
.sum{font-size:32px;font-weight:900;text-align:right;margin-top:14px}
.header-actions{display:flex;gap:7px}
.header-actions button{padding:8px 11px;font-size:13px}
hr{border:0;border-top:1px solid #eee;margin:15px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>오락실 정산 입력기</h1>
  <div class="sub">현장 입력 → 엑셀 세로복사. 모든 값은 이 브라우저에 자동 저장.</div>

  <section class="card">
    <strong>기계 선택</strong>
    <div class="grid" style="margin-top:11px">
      <button class="machine-btn" data-type="friends">짱프렌즈<br><small>29대</small></button>
      <button class="machine-btn" data-type="jamna">잼나3<br><small>4대</small></button>
      <button class="machine-btn" data-type="mini">미니<br><small>20대 · 좌/우</small></button>
      <button class="machine-btn" data-type="joy">조플<br><small>20대</small></button>
      <button class="machine-btn" data-type="ufo" style="grid-column:1/-1">UFO<br><small>15대 · 좌/우</small></button>
    </div>
    <button class="ok" id="exportExcel" style="width:100%;margin-top:12px">📗 전체 입력값 엑셀 파일로 저장</button>
    <div class="small">Excel에서 바로 열리는 통합 파일(.xml)로 저장됩니다. 로그인 필요 없음.</div>
  </section>

  <section class="card hidden" id="entryCard">
    <div class="top">
      <div class="name" id="machineTitle"></div>
      <div class="progress" id="progress"></div>
    </div>
    <div id="fields"></div>
    <div class="controls">
      <button id="prev">← 이전</button>
      <button class="primary" id="next">저장 후 다음 →</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card hidden" id="resultsCard">
    <div class="top">
      <strong>엑셀용 결과</strong>
      <span class="progress" id="done"></span>
    </div>
    <div class="result-buttons" id="resultButtons"></div>
    <div class="small">세로복사는 한 열로, 좌/우 2열 복사는 엑셀에서 왼쪽·오른쪽 열로 나뉘어 붙여넣어짐.</div>
    <hr>
    <div class="result-buttons">
      <button id="missing">미입력 찾기</button>
      <button class="danger" id="reset">현재 기계군 초기화</button>
    </div>
  </section>

  <section class="card hidden" id="textCard">
    <div class="top">
      <strong id="textTitle"></strong>
      <div class="header-actions"><button id="closeText">닫기</button></div>
    </div>
    <textarea id="textOut" readonly></textarea>
  </section>

  <section class="card hidden" id="calcCard">
    <div class="top">
      <strong>짱프렌즈 매출 계산 화면</strong>
      <button id="closeCalc">닫기</button>
    </div>
    <div class="calc" id="calcText"></div>
    <div class="sum" id="calcSum"></div>
    <div class="small">회사에서 계산기 인증 화면 요구할 때 캡처용.</div>
  </section>
</div>

<script>
(()=>{
const CONFIG={
 friends:{label:"짱프렌즈",count:29,fields:[
   {key:"sales",label:"누적 매출"},
   {key:"output",label:"배출량"}
 ]},
 jamna:{label:"잼나3",count:4,fields:[
   {key:"output",label:"배출량"}
 ]},
 mini:{label:"미니",count:20,paired:true,fields:[
   {key:"leftOutput",label:"왼쪽 배출"},
   {key:"rightOutput",label:"오른쪽 배출"}
 ]},
 joy:{label:"조이플레이어",count:20,fields:[
   {key:"output",label:"배출량"}
 ]},
 ufo:{label:"UFO",count:15,paired:true,ufo:true,fields:[
   {key:"leftTotal",label:"왼쪽 총판"},
   {key:"leftOutput",label:"왼쪽 배출"},
   {key:"rightTotal",label:"오른쪽 총판"},
   {key:"rightOutput",label:"오른쪽 배출"}
 ]}
};
const KEY="arcade_input_proto_v2";
let all=JSON.parse(localStorage.getItem(KEY)||"{}");
let type=null,index=0;
const $=id=>document.getElementById(id);

function ensure(t){
 if(!all[t]){
   all[t]={index:0,rows:Array.from({length:CONFIG[t].count},(_,i)=>({machine:i+1}))};
 }
 CONFIG[t].fields.forEach(f=>all[t].rows.forEach(r=>{if(r[f.key]===undefined)r[f.key]=""}));
}
function persist(){localStorage.setItem(KEY,JSON.stringify(all))}
function val(id){return $(id).value.trim()}
function setType(t){
 type=t;ensure(t);index=all[t].index||0;
 document.querySelectorAll(".machine-btn").forEach(b=>b.classList.toggle("active",b.dataset.type===t));
 $("entryCard").classList.remove("hidden");$("resultsCard").classList.remove("hidden");
 $("textCard").classList.add("hidden");$("calcCard").classList.add("hidden");
 render();
 window.scrollTo({top:$("entryCard").offsetTop-10,behavior:"smooth"});
}
function makeInput(field,row){
 return `<label>${field.label}</label>
 <input id="f_${field.key}" type="number" inputmode="numeric" pattern="[0-9]*"
 placeholder="숫자 입력" value="${row[field.key]??""}">`;
}
function renderFields(c,row){
 if(c.ufo){
   return `
   <div class="two">
    <div><div class="side-title">왼쪽</div>
      <label>총판</label><input id="f_leftTotal" type="number" inputmode="numeric" value="${row.leftTotal||""}">
      <label>배출량</label><input id="f_leftOutput" type="number" inputmode="numeric" value="${row.leftOutput||""}">
    </div>
    <div><div class="side-title">오른쪽</div>
      <label>총판</label><input id="f_rightTotal" type="number" inputmode="numeric" value="${row.rightTotal||""}">
      <label>배출량</label><input id="f_rightOutput" type="number" inputmode="numeric" value="${row.rightOutput||""}">
    </div>
   </div>`;
 }
 if(type==="mini"){
   return `<div class="two">
    <div><div class="side-title">왼쪽</div>${makeInput(c.fields[0],row)}</div>
    <div><div class="side-title">오른쪽</div>${makeInput(c.fields[1],row)}</div>
   </div>`;
 }
 return c.fields.map(f=>makeInput(f,row)).join("");
}
function render(){
 const c=CONFIG[type],row=all[type].rows[index];
 $("machineTitle").textContent=`${c.label} ${String(index+1).padStart(2,"0")}`;
 $("progress").textContent=`${index+1} / ${c.count}`;
 $("fields").innerHTML=renderFields(c,row);
 $("prev").disabled=index===0;
 $("next").textContent=index===c.count-1?"저장 완료 ✓":"저장 후 다음 →";
 $("status").textContent="";
 const completed=all[type].rows.filter(r=>c.fields.every(f=>(r[f.key]??"")!=="")).length;
 $("done").textContent=`${completed} / ${c.count} 완료`;
 buildResultButtons();
 const first=$("fields").querySelector("input"); if(first)setTimeout(()=>first.focus(),70);
}
function commit(){
 const c=CONFIG[type],row=all[type].rows[index];
 c.fields.forEach(f=>row[f.key]=val("f_"+f.key));
 all[type].index=index;persist();
}
function completeRow(){
 const c=CONFIG[type];
 return c.fields.every(f=>val("f_"+f.key)!=="");
}
function copyFallback(text,title){
 $("textTitle").textContent=title+" · 길게 눌러 복사";
 $("textOut").value=text;$("textCard").classList.remove("hidden");
 $("textOut").focus();$("textOut").select();
 $("textCard").scrollIntoView({behavior:"smooth"});
}
async function copyText(text,title){
 try{await navigator.clipboard.writeText(text);$("status").textContent=title+" 복사됨 ✓";}
 catch(e){copyFallback(text,title)}
}
function vertical(keys){
 const rows=all[type].rows, out=[];
 rows.forEach(r=>keys.forEach(k=>out.push(r[k]??"")));
 return out.join("\n");
}
function twoColumns(leftKey,rightKey){
 const rows=all[type].rows;
 return rows.map(r=>`${r[leftKey]??""}\t${r[rightKey]??""}`).join("\n");
}
function buildResultButtons(){
 const box=$("resultButtons");box.innerHTML="";
 const add=(text,fn,primary=false)=>{
   const b=document.createElement("button");b.textContent=text;if(primary)b.classList.add("primary");
   b.onclick=fn;box.appendChild(b);
 };
 if(type==="friends"){
   add("매출 누적값 복사",()=>{commit();copyText(vertical(["sales"]),"매출")});
   add("배출량 복사",()=>{commit();copyText(vertical(["output"]),"배출량")});
   add("매출값 보기",()=>showText(vertical(["sales"]),"짱프렌즈 매출"),false);
   add("배출값 보기",()=>showText(vertical(["output"]),"짱프렌즈 배출"),false);
   add("매출 계산 화면",showCalc,true);
 }else if(type==="jamna"||type==="joy"){
   add("배출량 복사",()=>{commit();copyText(vertical(["output"]),"배출량")},true);
   add("배출값 보기",()=>showText(vertical(["output"]),"배출량"));
 }else if(type==="mini"){
   add("왼쪽 배출 열 복사",()=>{commit();copyText(vertical(["leftOutput"]),"미니 왼쪽 배출")});
   add("오른쪽 배출 열 복사",()=>{commit();copyText(vertical(["rightOutput"]),"미니 오른쪽 배출")});
   add("좌/우 2열 복사",()=>{commit();copyText(twoColumns("leftOutput","rightOutput"),"미니 좌/우 2열")},true);
   add("2열 미리보기",()=>showText(twoColumns("leftOutput","rightOutput"),"미니 배출 좌/우 2열"));
 }else if(type==="ufo"){
   add("왼쪽 총판 열 복사",()=>{commit();copyText(vertical(["leftTotal"]),"UFO 왼쪽 총판")});
   add("오른쪽 총판 열 복사",()=>{commit();copyText(vertical(["rightTotal"]),"UFO 오른쪽 총판")});
   add("총판 좌/우 2열 복사",()=>{commit();copyText(twoColumns("leftTotal","rightTotal"),"UFO 총판 좌/우 2열")},true);
   add("왼쪽 배출 열 복사",()=>{commit();copyText(vertical(["leftOutput"]),"UFO 왼쪽 배출")});
   add("오른쪽 배출 열 복사",()=>{commit();copyText(vertical(["rightOutput"]),"UFO 오른쪽 배출")});
   add("배출 좌/우 2열 복사",()=>{commit();copyText(twoColumns("leftOutput","rightOutput"),"UFO 배출 좌/우 2열")},true);
 }
}
function showText(text,title){
 commit();$("textTitle").textContent=title;$("textOut").value=text;
 $("textCard").classList.remove("hidden");$("textCard").scrollIntoView({behavior:"smooth"});
}
function showCalc(){
 commit();
 const vals=all.friends.rows.map(r=>r.sales).filter(v=>v!=="").map(Number);
 $("calcText").textContent=vals.map(v=>v.toLocaleString("ko-KR")).join(" + ");
 $("calcSum").textContent="= "+vals.reduce((a,b)=>a+b,0).toLocaleString("ko-KR");
 $("calcCard").classList.remove("hidden");$("calcCard").scrollIntoView({behavior:"smooth"});
}
$("next").onclick=()=>{
 if(!completeRow()){$("status").textContent="이 기계의 필요한 값을 전부 입력해줘.";return}
 commit();
 if(index<CONFIG[type].count-1){index++;all[type].index=index;persist();render()}
 else{$("status").textContent="입력 완료 ✓";render()}
};
$("prev").onclick=()=>{commit();if(index>0)index--;all[type].index=index;persist();render()};
$("missing").onclick=()=>{
 commit();const c=CONFIG[type];
 const i=all[type].rows.findIndex(r=>c.fields.some(f=>(r[f.key]??"")===""));
 if(i<0){$("status").textContent="전부 입력되어 있음 ✓";return}
 index=i;all[type].index=i;persist();render();$("entryCard").scrollIntoView({behavior:"smooth"});
};
$("reset").onclick=()=>{
 if(confirm(`${CONFIG[type].label} 입력값을 전부 지울까?`)){
   delete all[type];persist();ensure(type);index=0;render();
 }
};

function escXml(v){
 return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function cell(v,header=false){
 const isNum = v!=="" && v!==null && v!==undefined && !isNaN(Number(v));
 const type = isNum ? "Number" : "String";
 const style = header ? ' ss:StyleID="Header"' : "";
 return `<Cell${style}><Data ss:Type="${type}">${escXml(v)}</Data></Cell>`;
}
function worksheet(name, headers, rows){
 let body = `<Row>${headers.map(h=>cell(h,true)).join("")}</Row>`;
 rows.forEach(r=>{ body += `<Row>${r.map(v=>cell(v)).join("")}</Row>`; });
 return `<Worksheet ss:Name="${escXml(name)}"><Table>${body}</Table></Worksheet>`;
}
function ensureAll(){
 Object.keys(CONFIG).forEach(ensure);
 persist();
}
function buildExcelXml(){
 ensureAll();
 const sheets=[];

 sheets.push(worksheet("짱프렌즈",
   ["기계명","누적 매출","배출량"],
   all.friends.rows.map(r=>[`짱프렌즈_${String(r.machine).padStart(2,"0")}`,r.sales,r.output])
 ));
 sheets.push(worksheet("잼나3",
   ["기계명","배출량"],
   all.jamna.rows.map(r=>[`잼나3_${r.machine}`,r.output])
 ));
 sheets.push(worksheet("미니",
   ["기계명","배출량"],
   all.mini.rows.flatMap(r=>[
      [`잼나 4 미니_${r.machine*2-1}`,r.leftOutput],
      [`잼나 4 미니_${r.machine*2}`,r.rightOutput]
   ])
 ));
 sheets.push(worksheet("조이플레이어",
   ["기계명","배출량"],
   all.joy.rows.map(r=>[`조이플레이어_${r.machine}`,r.output])
 ));
 sheets.push(worksheet("UFO",
   ["기계명","총판","배출량"],
   all.ufo.rows.flatMap(r=>[
      [`UFO_${r.machine} L`,r.leftTotal,r.leftOutput],
      [`UFO_${r.machine} R`,r.rightTotal,r.rightOutput]
   ])
 ));

 return `<?xml version="1.0"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office"
 xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
 <Styles>
  <Style ss:ID="Default" ss:Name="Normal">
   <Alignment ss:Vertical="Center"/>
   <Font ss:FontName="Arial" ss:Size="11"/>
  </Style>
  <Style ss:ID="Header">
   <Font ss:FontName="Arial" ss:Size="11" ss:Bold="1"/>
   <Interior ss:Color="#E7E7EA" ss:Pattern="Solid"/>
  </Style>
 </Styles>
 ${sheets.join("\n")}
</Workbook>`;
}
function exportExcelFile(){
 if(type) commit();
 const xml=buildExcelXml();
 const blob=new Blob([xml],{type:"application/vnd.ms-excel;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 const now=new Date();
 const pad=n=>String(n).padStart(2,"0");
 const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
 a.href=url;
 a.download=`오락실_정산입력_${stamp}.xml`;
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 if(type) $("status").textContent="전체 입력값 엑셀 파일 저장 완료 ✓";
}
$("exportExcel").onclick=exportExcelFile;

$("closeText").onclick=()=>$("textCard").classList.add("hidden");
$("closeCalc").onclick=()=>$("calcCard").classList.add("hidden");
document.querySelectorAll(".machine-btn").forEach(b=>b.onclick=()=>setType(b.dataset.type));
})();
</script>
</body>
</html>
